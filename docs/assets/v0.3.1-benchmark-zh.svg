<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 570" role="img" aria-labelledby="title desc">
  <title id="title">mini-trellis 与 Trellis 在 Claude Code 上的实测耗时与 Token 消耗对比</title>
  <desc id="desc">同一项目代码、同一 .trellis 知识库、同一 Claude Code (v2.1.306) 与同一模型 (deepseek-v4-flash, effort=max) 下，6 组任务各重复 3 次的实测对比。</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .panel { fill: #ffffff; stroke: #dcd8ce; stroke-width: 1.2; }
      .kpi-card { fill: #ffffff; stroke: #dcd8ce; stroke-width: 1.2; }
      .kpi-accent { fill: #1f7a5c; }
      .row-divider { stroke: #efece4; stroke-width: 1; }
      .col-divider { stroke: #e2ded4; stroke-width: 1; stroke-dasharray: 3 3; }
      .fig-title { font: 700 16px "Georgia", "Times New Roman", "Songti SC", "SimSun", serif; fill: #1f1e1b; }
      .fig-sub { font: 400 11.5px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #57544d; }
      .legend-text { font: 600 11.5px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #2a2925; }
      .kpi-title { font: 600 11.5px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #57544d; }
      .kpi-big { font: 700 22px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #165e46; }
      .kpi-tag { font: 600 11px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #165e46; }
      .kpi-sub { font: 400 11px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #3a3833; }
      .col-header { font: 700 12.5px "Georgia", "Times New Roman", "Songti SC", serif; fill: #1f1e1b; }
      .col-sub { font: 400 10.5px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #6e6a61; }
      .task-title { font: 600 12px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #1f1e1b; }
      .task-code { font: 600 10.5px "SFMono-Regular", Consolas, monospace; fill: #57544d; }
      .task-desc { font: 400 10.5px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #6e6a61; }
      .bar-trellis { fill: #cf6a5a; opacity: 0.85; }
      .bar-mini { fill: #1f7a5c; }
      .bar-track { fill: #f5f3ee; }
      .val-trellis { font: 500 10.5px "SFMono-Regular", Consolas, monospace; fill: #8c3b2e; }
      .val-mini { font: 700 11px "SFMono-Regular", Consolas, monospace; fill: #145942; }
      .badge-bg { fill: #e6f4ee; stroke: #9ecbb9; stroke-width: 1; }
      .badge-text { font: 700 11px "SFMono-Regular", Consolas, monospace; fill: #145942; }
      .foot { font: 400 11px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #57544d; }
    </style>
  </defs>

  <rect width="980" height="570" rx="8" class="bg"/>

  <!-- Header -->
  <text x="28" y="30" class="fig-title">mini-trellis vs Trellis：Claude Code 实测耗时与 Token 消耗对比</text>
  <text x="28" y="49" class="fig-sub">控制变量：同一套业务代码、同一份 .trellis 知识库、同一 Claude Code (v2.1.306) 与同一模型 (deepseek-v4-flash, 思考程度 max)</text>

  <!-- Legend -->
  <g transform="translate(612, 16)">
    <rect x="0" y="0" width="340" height="32" rx="4" fill="#ffffff" stroke="#dcd8ce" stroke-width="1"/>
    <rect x="14" y="10" width="12" height="12" rx="2" class="bar-trellis"/>
    <text x="32" y="20" class="legend-text">Trellis v0.7.0-beta.4</text>
    <rect x="168" y="10" width="12" height="12" rx="2" class="bar-mini"/>
    <text x="186" y="20" class="legend-text">mini-trellis v0.3.1</text>
  </g>

  <!-- Top KPI Cards (All 54 sessions across 6 tasks x 3 repeats) -->
  <g transform="translate(28, 64)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="296" height="72" rx="5" class="kpi-card"/>
    <rect x="0" y="0" width="5" height="72" rx="2" class="kpi-accent"/>
    <text x="18" y="22" class="kpi-title">全部任务累计耗时（每题 3 次合计）</text>
    <text x="18" y="47" class="kpi-big">-38.4%</text>
    <rect x="114" y="32" width="76" height="19" rx="9.5" class="badge-bg"/>
    <text x="152" y="45" text-anchor="middle" class="kpi-tag">提速 1.62×</text>
    <text x="18" y="64" class="kpi-sub">mini-trellis 472.2s  vs  Trellis 766.5s</text>

    <!-- KPI 2 -->
    <g transform="translate(314, 0)">
      <rect x="0" y="0" width="296" height="72" rx="5" class="kpi-card"/>
      <rect x="0" y="0" width="5" height="72" rx="2" class="kpi-accent"/>
      <text x="18" y="22" class="kpi-title">全部任务累计处理 Token（含输入/输出/缓存）</text>
      <text x="18" y="47" class="kpi-big">-40.1%</text>
      <rect x="114" y="32" width="108" height="19" rx="9.5" class="badge-bg"/>
      <text x="168" y="45" text-anchor="middle" class="kpi-tag">少用 162.7万</text>
      <text x="18" y="64" class="kpi-sub">mini-trellis 242.6万  vs  Trellis 405.3万</text>
    </g>

    <!-- KPI 3 -->
    <g transform="translate(628, 0)">
      <rect x="0" y="0" width="296" height="72" rx="5" class="kpi-card"/>
      <rect x="0" y="0" width="5" height="72" rx="2" class="kpi-accent"/>
      <text x="18" y="22" class="kpi-title">全部任务累计交互轮次与自动检查</text>
      <text x="18" y="47" class="kpi-big">-27.8%</text>
      <rect x="114" y="32" width="114" height="19" rx="9.5" class="badge-bg"/>
      <text x="171" y="45" text-anchor="middle" class="kpi-tag">自动检查通过</text>
      <text x="18" y="64" class="kpi-sub">mini-trellis 273 轮  vs  Trellis 378 轮（少 105 轮）</text>
    </g>
  </g>

  <!-- Main Comparison Panel -->
  <g transform="translate(28, 150)">
    <rect x="0" y="0" width="924" height="384" rx="5" class="panel"/>

    <!-- Column Headers -->
    <text x="18" y="25" class="col-header">评测任务（每项独立运行 3 次）</text>
    <text x="18" y="41" class="col-sub">涵盖启动、写代码、查规范问答与跨会话迭代</text>

    <line x1="250" y1="10" x2="250" y2="374" class="col-divider"/>
    <text x="268" y="25" class="col-header">(a) 单次中位耗时对比（秒）</text>
    <text x="268" y="41" class="col-sub">以各题 Trellis 耗时为 100% 基准条长，越短越快</text>

    <line x1="586" y1="10" x2="586" y2="374" class="col-divider"/>
    <text x="604" y="25" class="col-header">(b) 单次中位 Token 消耗对比（千）</text>
    <text x="604" y="41" class="col-sub">以各题 Trellis Token 为 100% 基准条长，越短越省</text>

    <line x1="0" y1="52" x2="924" y2="52" stroke="#dcd8ce" stroke-width="1"/>
    <g transform="translate(0, 52)">
      <text x="18" y="23" class="task-title">空载启动开销 <tspan class="task-code">(O00)</tspan></text>
      <text x="18" y="41" class="task-desc">仅回复 pong，不读写文件，测固定启动注入</text>
      <rect x="268" y="10" width="185.0" height="13" rx="2.5" class="bar-trellis"/>
      <text x="460.0" y="20.5" class="val-trellis">2.9s</text>
      <rect x="268" y="28" width="185.0" height="14" rx="2.5" class="bar-track"/>
      <rect x="268" y="28" width="112.4" height="14" rx="2.5" class="bar-mini"/>
      <text x="387.4" y="39" class="val-mini">1.8s</text>
      <rect x="516" y="16" width="54" height="22" rx="11" class="badge-bg"/>
      <text x="543" y="31" text-anchor="middle" class="badge-text">-39%</text>
      <rect x="604" y="10" width="185.0" height="13" rx="2.5" class="bar-trellis"/>
      <text x="796.0" y="20.5" class="val-trellis">13.6k</text>
      <rect x="604" y="28" width="185.0" height="14" rx="2.5" class="bar-track"/>
      <rect x="604" y="28" width="157.6" height="14" rx="2.5" class="bar-mini"/>
      <text x="768.6" y="39" class="val-mini">11.6k</text>
      <rect x="854" y="16" width="54" height="22" rx="11" class="badge-bg"/>
      <text x="881" y="31" text-anchor="middle" class="badge-text">-15%</text>
    </g>
    <line x1="14" y1="107" x2="910" y2="107" class="row-divider"/>
    <g transform="translate(0, 107)">
      <text x="18" y="23" class="task-title">常规函数实现 <tspan class="task-code">(N01)</tspan></text>
      <text x="18" y="41" class="task-desc">按注释实现 normalize_label 并编写单元测试</text>
      <rect x="268" y="10" width="185.0" height="13" rx="2.5" class="bar-trellis"/>
      <text x="460.0" y="20.5" class="val-trellis">18.6s</text>
      <rect x="268" y="28" width="185.0" height="14" rx="2.5" class="bar-track"/>
      <rect x="268" y="28" width="168.0" height="14" rx="2.5" class="bar-mini"/>
      <text x="443.0" y="39" class="val-mini">16.9s</text>
      <rect x="516" y="16" width="54" height="22" rx="11" class="badge-bg"/>
      <text x="543" y="31" text-anchor="middle" class="badge-text">-9%</text>
      <rect x="604" y="10" width="185.0" height="13" rx="2.5" class="bar-trellis"/>
      <text x="796.0" y="20.5" class="val-trellis">131.4k</text>
      <rect x="604" y="28" width="185.0" height="14" rx="2.5" class="bar-track"/>
      <rect x="604" y="28" width="119.6" height="14" rx="2.5" class="bar-mini"/>
      <text x="730.6" y="39" class="val-mini">84.9k</text>
      <rect x="854" y="16" width="54" height="22" rx="11" class="badge-bg"/>
      <text x="881" y="31" text-anchor="middle" class="badge-text">-35%</text>
    </g>
    <line x1="14" y1="162" x2="910" y2="162" class="row-divider"/>
    <g transform="translate(0, 162)">
      <text x="18" y="23" class="task-title">查规范：计算公式 <tspan class="task-code">(R01)</tspan></text>
      <text x="18" y="41" class="task-desc">检索容量与实际流量影响公式及异常策略</text>
      <rect x="268" y="10" width="185.0" height="13" rx="2.5" class="bar-trellis"/>
      <text x="460.0" y="20.5" class="val-trellis">20.4s</text>
      <rect x="268" y="28" width="185.0" height="14" rx="2.5" class="bar-track"/>
      <rect x="268" y="28" width="131.7" height="14" rx="2.5" class="bar-mini"/>
      <text x="406.7" y="39" class="val-mini">14.5s</text>
      <rect x="516" y="16" width="54" height="22" rx="11" class="badge-bg"/>
      <text x="543" y="31" text-anchor="middle" class="badge-text">-29%</text>
      <rect x="604" y="10" width="185.0" height="13" rx="2.5" class="bar-trellis"/>
      <text x="796.0" y="20.5" class="val-trellis">79.3k</text>
      <rect x="604" y="28" width="185.0" height="14" rx="2.5" class="bar-track"/>
      <rect x="604" y="28" width="133.5" height="14" rx="2.5" class="bar-mini"/>
      <text x="744.5" y="39" class="val-mini">57.3k</text>
      <rect x="854" y="16" width="54" height="22" rx="11" class="badge-bg"/>
      <text x="881" y="31" text-anchor="middle" class="badge-text">-28%</text>
    </g>
    <line x1="14" y1="217" x2="910" y2="217" class="row-divider"/>
    <g transform="translate(0, 217)">
      <text x="18" y="23" class="task-title">查规范：服务权限 <tspan class="task-code">(R02)</tspan></text>
      <text x="18" y="41" class="task-desc">检索只读工具服务的 5 项查询权限边界</text>
      <rect x="268" y="10" width="185.0" height="13" rx="2.5" class="bar-trellis"/>
      <text x="460.0" y="20.5" class="val-trellis">16.3s</text>
      <rect x="268" y="28" width="185.0" height="14" rx="2.5" class="bar-track"/>
      <rect x="268" y="28" width="81.6" height="14" rx="2.5" class="bar-mini"/>
      <text x="356.6" y="39" class="val-mini">7.2s</text>
      <rect x="516" y="16" width="54" height="22" rx="11" class="badge-bg"/>
      <text x="543" y="31" text-anchor="middle" class="badge-text">-56%</text>
      <rect x="604" y="10" width="185.0" height="13" rx="2.5" class="bar-trellis"/>
      <text x="796.0" y="20.5" class="val-trellis">70.4k</text>
      <rect x="604" y="28" width="185.0" height="14" rx="2.5" class="bar-track"/>
      <rect x="604" y="28" width="102.0" height="14" rx="2.5" class="bar-mini"/>
      <text x="713.0" y="39" class="val-mini">38.8k</text>
      <rect x="854" y="16" width="54" height="22" rx="11" class="badge-bg"/>
      <text x="881" y="31" text-anchor="middle" class="badge-text">-45%</text>
    </g>
    <line x1="14" y1="272" x2="910" y2="272" class="row-divider"/>
    <g transform="translate(0, 272)">
      <text x="18" y="23" class="task-title">按规范实现业务代码 <tspan class="task-code">(I01)</tspan></text>
      <text x="18" y="41" class="task-desc">查阅业务规范并实现 assess_notice 与测试</text>
      <rect x="268" y="10" width="185.0" height="13" rx="2.5" class="bar-trellis"/>
      <text x="460.0" y="20.5" class="val-trellis">57.1s</text>
      <rect x="268" y="28" width="185.0" height="14" rx="2.5" class="bar-track"/>
      <rect x="268" y="28" width="161.4" height="14" rx="2.5" class="bar-mini"/>
      <text x="436.4" y="39" class="val-mini">49.8s</text>
      <rect x="516" y="16" width="54" height="22" rx="11" class="badge-bg"/>
      <text x="543" y="31" text-anchor="middle" class="badge-text">-13%</text>
      <rect x="604" y="10" width="185.0" height="13" rx="2.5" class="bar-trellis"/>
      <text x="796.0" y="20.5" class="val-trellis">248.7k</text>
      <rect x="604" y="28" width="185.0" height="14" rx="2.5" class="bar-track"/>
      <rect x="604" y="28" width="143.2" height="14" rx="2.5" class="bar-mini"/>
      <text x="754.2" y="39" class="val-mini">192.6k</text>
      <rect x="854" y="16" width="54" height="22" rx="11" class="badge-bg"/>
      <text x="881" y="31" text-anchor="middle" class="badge-text">-23%</text>
    </g>
    <line x1="14" y1="327" x2="910" y2="327" class="row-divider"/>
    <g transform="translate(0, 327)">
      <text x="18" y="23" class="task-title">跨会话记规则与迭代 <tspan class="task-code">(M01)</tspan></text>
      <text x="18" y="41" class="task-desc">连续 4 个新会话：记规则→实现→改规则→更新</text>
      <rect x="268" y="10" width="185.0" height="13" rx="2.5" class="bar-trellis"/>
      <text x="460.0" y="20.5" class="val-trellis">132.9s</text>
      <rect x="268" y="28" width="185.0" height="14" rx="2.5" class="bar-track"/>
      <rect x="268" y="28" width="94.8" height="14" rx="2.5" class="bar-mini"/>
      <text x="369.8" y="39" class="val-mini">68.1s</text>
      <rect x="516" y="16" width="54" height="22" rx="11" class="badge-bg"/>
      <text x="543" y="31" text-anchor="middle" class="badge-text">-49%</text>
      <rect x="604" y="10" width="185.0" height="13" rx="2.5" class="bar-trellis"/>
      <text x="796.0" y="20.5" class="val-trellis">713.6k</text>
      <rect x="604" y="28" width="185.0" height="14" rx="2.5" class="bar-track"/>
      <rect x="604" y="28" width="110.4" height="14" rx="2.5" class="bar-mini"/>
      <text x="721.4" y="39" class="val-mini">426.0k</text>
      <rect x="854" y="16" width="54" height="22" rx="11" class="badge-bg"/>
      <text x="881" y="31" text-anchor="middle" class="badge-text">-40%</text>
    </g>
  </g>

  <text x="28" y="553" class="foot">说明：上方卡片为 6 组任务 × 3 次重复的总计对比；下方柱状图为每组任务 3 次重复的中位数对比（Trellis = 100% 基准宽度，绿字胶丸为 mini-trellis 节省比例）。</text>
</svg>

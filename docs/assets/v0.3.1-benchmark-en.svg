<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 570" role="img" aria-labelledby="title desc">
  <title id="title">mini-trellis vs Trellis on Claude Code: Measured Wall Time and Processed Tokens</title>
  <desc id="desc">Controlled benchmark on identical project code, identical .trellis knowledge base, Claude Code v2.1.306, and deepseek-v4-flash (effort=max) across 6 task types × 3 independent repeats.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .panel { fill: #ffffff; stroke: #dcd8ce; stroke-width: 1.2; }
      .kpi-card { fill: #ffffff; stroke: #dcd8ce; stroke-width: 1.2; }
      .kpi-accent { fill: #1f7a5c; }
      .row-divider { stroke: #efece4; stroke-width: 1; }
      .col-divider { stroke: #e2ded4; stroke-width: 1; stroke-dasharray: 3 3; }
      .fig-title { font: 700 15.5px "Georgia", "Times New Roman", serif; fill: #1f1e1b; }
      .fig-sub { font: 400 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #57544d; }
      .legend-text { font: 600 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2a2925; }
      .kpi-title { font: 600 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #57544d; }
      .kpi-big { font: 700 22px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #165e46; }
      .kpi-tag { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #165e46; }
      .kpi-sub { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #3a3833; }
      .col-header { font: 700 12.5px "Georgia", "Times New Roman", serif; fill: #1f1e1b; }
      .col-sub { font: 400 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e6a61; }
      .task-title { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f1e1b; }
      .task-code { font: 600 10.5px "SFMono-Regular", Consolas, monospace; fill: #57544d; }
      .task-desc { font: 400 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6e6a61; }
      .bar-trellis { fill: #cf6a5a; opacity: 0.85; }
      .bar-mini { fill: #1f7a5c; }
      .bar-track { fill: #f5f3ee; }
      .val-trellis { font: 500 10.5px "SFMono-Regular", Consolas, monospace; fill: #8c3b2e; }
      .val-mini { font: 700 11px "SFMono-Regular", Consolas, monospace; fill: #145942; }
      .badge-bg { fill: #e6f4ee; stroke: #9ecbb9; stroke-width: 1; }
      .badge-text { font: 700 11px "SFMono-Regular", Consolas, monospace; fill: #145942; }
      .foot { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #57544d; }
    </style>
  </defs>

  <rect width="980" height="570" rx="8" class="bg"/>

  <!-- Header -->
  <text x="28" y="30" class="fig-title">mini-trellis vs Trellis: End-to-End Claude Code Benchmark (Time &amp; Token Cost)</text>
  <text x="28" y="49" class="fig-sub">Identical codebase, identical .trellis knowledge base, Claude Code v2.1.306, and deepseek-v4-flash (effort = max)</text>

  <!-- Legend -->
  <g transform="translate(612, 16)">
    <rect x="0" y="0" width="340" height="32" rx="4" fill="#ffffff" stroke="#dcd8ce" stroke-width="1"/>
    <rect x="14" y="10" width="12" height="12" rx="2" class="bar-trellis"/>
    <text x="32" y="20" class="legend-text">Trellis v0.7.0-beta.4</text>
    <rect x="168" y="10" width="12" height="12" rx="2" class="bar-mini"/>
    <text x="186" y="20" class="legend-text">mini-trellis v0.3.1</text>
  </g>

  <!-- Top KPI Cards -->
  <g transform="translate(28, 64)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="296" height="72" rx="5" class="kpi-card"/>
    <rect x="0" y="0" width="5" height="72" rx="2" class="kpi-accent"/>
    <text x="18" y="22" class="kpi-title">Total Wall Time (All 6 tasks × 3 runs)</text>
    <text x="18" y="47" class="kpi-big">-38.4%</text>
    <rect x="114" y="32" width="84" height="19" rx="9.5" class="badge-bg"/>
    <text x="156" y="45" text-anchor="middle" class="kpi-tag">1.62× faster</text>
    <text x="18" y="64" class="kpi-sub">mini-trellis 472.2s  vs  Trellis 766.5s</text>

    <!-- KPI 2 -->
    <g transform="translate(314, 0)">
      <rect x="0" y="0" width="296" height="72" rx="5" class="kpi-card"/>
      <rect x="0" y="0" width="5" height="72" rx="2" class="kpi-accent"/>
      <text x="18" y="22" class="kpi-title">Total Processed Tokens (Input + Out + Cache)</text>
      <text x="18" y="47" class="kpi-big">-40.1%</text>
      <rect x="114" y="32" width="114" height="19" rx="9.5" class="badge-bg"/>
      <text x="171" y="45" text-anchor="middle" class="kpi-tag">-1.63M tokens</text>
      <text x="18" y="64" class="kpi-sub">mini-trellis 2.43M  vs  Trellis 4.05M</text>
    </g>

    <!-- KPI 3 -->
    <g transform="translate(628, 0)">
      <rect x="0" y="0" width="296" height="72" rx="5" class="kpi-card"/>
      <rect x="0" y="0" width="5" height="72" rx="2" class="kpi-accent"/>
      <text x="18" y="22" class="kpi-title">Total Agent Turns &amp; Automated Checks</text>
      <text x="18" y="47" class="kpi-big">-27.8%</text>
      <rect x="114" y="32" width="118" height="19" rx="9.5" class="badge-bg"/>
      <text x="173" y="45" text-anchor="middle" class="kpi-tag">Auto checks passed</text>
      <text x="18" y="64" class="kpi-sub">mini-trellis 273 turns  vs  Trellis 378 turns</text>
    </g>
  </g>

  <!-- Main Comparison Panel -->
  <g transform="translate(28, 150)">
    <rect x="0" y="0" width="924" height="384" rx="5" class="panel"/>

    <!-- Column Headers -->
    <text x="18" y="25" class="col-header">Evaluation Task (3 independent runs each)</text>
    <text x="18" y="41" class="col-sub">Startup, coding, spec lookup &amp; multi-session continuity</text>

    <line x1="258" y1="10" x2="258" y2="374" class="col-divider"/>
    <text x="274" y="25" class="col-header">(a) Median Wall Time (seconds)</text>
    <text x="274" y="41" class="col-sub">Normalized to Trellis = 100% bar width (shorter is faster)</text>

    <line x1="590" y1="10" x2="590" y2="374" class="col-divider"/>
    <text x="606" y="25" class="col-header">(b) Median Processed Tokens (thousands)</text>
    <text x="606" y="41" class="col-sub">Normalized to Trellis = 100% bar width (shorter is leaner)</text>

    <line x1="0" y1="52" x2="924" y2="52" stroke="#dcd8ce" stroke-width="1"/>
    <g transform="translate(0, 52)">
      <text x="18" y="23" class="task-title">Cold Startup Overhead <tspan class="task-code">(O00)</tspan></text>
      <text x="18" y="41" class="task-desc">Reply pong without reading files; measures startup hook</text>
      <rect x="274" y="10" width="182.0" height="13" rx="2.5" class="bar-trellis"/>
      <text x="463.0" y="20.5" class="val-trellis">2.9s</text>
      <rect x="274" y="28" width="182.0" height="14" rx="2.5" class="bar-track"/>
      <rect x="274" y="28" width="110.6" height="14" rx="2.5" class="bar-mini"/>
      <text x="391.6" y="39" class="val-mini">1.8s</text>
      <rect x="520" y="16" width="54" height="22" rx="11" class="badge-bg"/>
      <text x="547" y="31" text-anchor="middle" class="badge-text">-39%</text>
      <rect x="606" y="10" width="182.0" height="13" rx="2.5" class="bar-trellis"/>
      <text x="795.0" y="20.5" class="val-trellis">13.6k</text>
      <rect x="606" y="28" width="182.0" height="14" rx="2.5" class="bar-track"/>
      <rect x="606" y="28" width="155.1" height="14" rx="2.5" class="bar-mini"/>
      <text x="768.1" y="39" class="val-mini">11.6k</text>
      <rect x="854" y="16" width="54" height="22" rx="11" class="badge-bg"/>
      <text x="881" y="31" text-anchor="middle" class="badge-text">-15%</text>
    </g>
    <line x1="14" y1="107" x2="910" y2="107" class="row-divider"/>
    <g transform="translate(0, 107)">
      <text x="18" y="23" class="task-title">Focused Function Coding <tspan class="task-code">(N01)</tspan></text>
      <text x="18" y="41" class="task-desc">Implement normalize_label + stdlib unittest suite</text>
      <rect x="274" y="10" width="182.0" height="13" rx="2.5" class="bar-trellis"/>
      <text x="463.0" y="20.5" class="val-trellis">18.6s</text>
      <rect x="274" y="28" width="182.0" height="14" rx="2.5" class="bar-track"/>
      <rect x="274" y="28" width="165.3" height="14" rx="2.5" class="bar-mini"/>
      <text x="446.3" y="39" class="val-mini">16.9s</text>
      <rect x="520" y="16" width="54" height="22" rx="11" class="badge-bg"/>
      <text x="547" y="31" text-anchor="middle" class="badge-text">-9%</text>
      <rect x="606" y="10" width="182.0" height="13" rx="2.5" class="bar-trellis"/>
      <text x="795.0" y="20.5" class="val-trellis">131.4k</text>
      <rect x="606" y="28" width="182.0" height="14" rx="2.5" class="bar-track"/>
      <rect x="606" y="28" width="117.6" height="14" rx="2.5" class="bar-mini"/>
      <text x="730.6" y="39" class="val-mini">84.9k</text>
      <rect x="854" y="16" width="54" height="22" rx="11" class="badge-bg"/>
      <text x="881" y="31" text-anchor="middle" class="badge-text">-35%</text>
    </g>
    <line x1="14" y1="162" x2="910" y2="162" class="row-divider"/>
    <g transform="translate(0, 162)">
      <text x="18" y="23" class="task-title">Spec Lookup: Formulas <tspan class="task-code">(R01)</tspan></text>
      <text x="18" y="41" class="task-desc">Locate capacity vs flow impact formulas &amp; edge policies</text>
      <rect x="274" y="10" width="182.0" height="13" rx="2.5" class="bar-trellis"/>
      <text x="463.0" y="20.5" class="val-trellis">20.4s</text>
      <rect x="274" y="28" width="182.0" height="14" rx="2.5" class="bar-track"/>
      <rect x="274" y="28" width="129.6" height="14" rx="2.5" class="bar-mini"/>
      <text x="410.6" y="39" class="val-mini">14.5s</text>
      <rect x="520" y="16" width="54" height="22" rx="11" class="badge-bg"/>
      <text x="547" y="31" text-anchor="middle" class="badge-text">-29%</text>
      <rect x="606" y="10" width="182.0" height="13" rx="2.5" class="bar-trellis"/>
      <text x="795.0" y="20.5" class="val-trellis">79.3k</text>
      <rect x="606" y="28" width="182.0" height="14" rx="2.5" class="bar-track"/>
      <rect x="606" y="28" width="131.4" height="14" rx="2.5" class="bar-mini"/>
      <text x="744.4" y="39" class="val-mini">57.3k</text>
      <rect x="854" y="16" width="54" height="22" rx="11" class="badge-bg"/>
      <text x="881" y="31" text-anchor="middle" class="badge-text">-28%</text>
    </g>
    <line x1="14" y1="217" x2="910" y2="217" class="row-divider"/>
    <g transform="translate(0, 217)">
      <text x="18" y="23" class="task-title">Spec Lookup: Permissions <tspan class="task-code">(R02)</tspan></text>
      <text x="18" y="41" class="task-desc">Verify 5 read-only tool service permission boundaries</text>
      <rect x="274" y="10" width="182.0" height="13" rx="2.5" class="bar-trellis"/>
      <text x="463.0" y="20.5" class="val-trellis">16.3s</text>
      <rect x="274" y="28" width="182.0" height="14" rx="2.5" class="bar-track"/>
      <rect x="274" y="28" width="80.3" height="14" rx="2.5" class="bar-mini"/>
      <text x="361.3" y="39" class="val-mini">7.2s</text>
      <rect x="520" y="16" width="54" height="22" rx="11" class="badge-bg"/>
      <text x="547" y="31" text-anchor="middle" class="badge-text">-56%</text>
      <rect x="606" y="10" width="182.0" height="13" rx="2.5" class="bar-trellis"/>
      <text x="795.0" y="20.5" class="val-trellis">70.4k</text>
      <rect x="606" y="28" width="182.0" height="14" rx="2.5" class="bar-track"/>
      <rect x="606" y="28" width="100.3" height="14" rx="2.5" class="bar-mini"/>
      <text x="713.3" y="39" class="val-mini">38.8k</text>
      <rect x="854" y="16" width="54" height="22" rx="11" class="badge-bg"/>
      <text x="881" y="31" text-anchor="middle" class="badge-text">-45%</text>
    </g>
    <line x1="14" y1="272" x2="910" y2="272" class="row-divider"/>
    <g transform="translate(0, 272)">
      <text x="18" y="23" class="task-title">Spec-Driven Implementation <tspan class="task-code">(I01)</tspan></text>
      <text x="18" y="41" class="task-desc">Find business spec &amp; implement assess_notice + tests</text>
      <rect x="274" y="10" width="182.0" height="13" rx="2.5" class="bar-trellis"/>
      <text x="463.0" y="20.5" class="val-trellis">57.1s</text>
      <rect x="274" y="28" width="182.0" height="14" rx="2.5" class="bar-track"/>
      <rect x="274" y="28" width="158.8" height="14" rx="2.5" class="bar-mini"/>
      <text x="439.8" y="39" class="val-mini">49.8s</text>
      <rect x="520" y="16" width="54" height="22" rx="11" class="badge-bg"/>
      <text x="547" y="31" text-anchor="middle" class="badge-text">-13%</text>
      <rect x="606" y="10" width="182.0" height="13" rx="2.5" class="bar-trellis"/>
      <text x="795.0" y="20.5" class="val-trellis">248.7k</text>
      <rect x="606" y="28" width="182.0" height="14" rx="2.5" class="bar-track"/>
      <rect x="606" y="28" width="140.9" height="14" rx="2.5" class="bar-mini"/>
      <text x="753.9" y="39" class="val-mini">192.6k</text>
      <rect x="854" y="16" width="54" height="22" rx="11" class="badge-bg"/>
      <text x="881" y="31" text-anchor="middle" class="badge-text">-23%</text>
    </g>
    <line x1="14" y1="327" x2="910" y2="327" class="row-divider"/>
    <g transform="translate(0, 327)">
      <text x="18" y="23" class="task-title">4-Session Rule Evolution <tspan class="task-code">(M01)</tspan></text>
      <text x="18" y="41" class="task-desc">4 fresh sessions: Save rule → Code → Update rule → Re-code</text>
      <rect x="274" y="10" width="182.0" height="13" rx="2.5" class="bar-trellis"/>
      <text x="463.0" y="20.5" class="val-trellis">132.9s</text>
      <rect x="274" y="28" width="182.0" height="14" rx="2.5" class="bar-track"/>
      <rect x="274" y="28" width="93.3" height="14" rx="2.5" class="bar-mini"/>
      <text x="374.3" y="39" class="val-mini">68.1s</text>
      <rect x="520" y="16" width="54" height="22" rx="11" class="badge-bg"/>
      <text x="547" y="31" text-anchor="middle" class="badge-text">-49%</text>
      <rect x="606" y="10" width="182.0" height="13" rx="2.5" class="bar-trellis"/>
      <text x="795.0" y="20.5" class="val-trellis">713.6k</text>
      <rect x="606" y="28" width="182.0" height="14" rx="2.5" class="bar-track"/>
      <rect x="606" y="28" width="108.6" height="14" rx="2.5" class="bar-mini"/>
      <text x="721.6" y="39" class="val-mini">426.0k</text>
      <rect x="854" y="16" width="54" height="22" rx="11" class="badge-bg"/>
      <text x="881" y="31" text-anchor="middle" class="badge-text">-40%</text>
    </g>
  </g>

  <text x="28" y="553" class="foot">Note: Top cards show cumulative totals across 6 tasks × 3 repeats (27 sessions per tool); bars show 3-run medians (green pills = mini-trellis savings).</text>
</svg>

name: Publish to npm

# Disabled until mini-trellis / mini-trellis-core are ready to publish
# under the new unscoped names. Re-enable by restoring the `on:` triggers
# and rewriting release-preflight for those package names.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish is paused
        run: |
          echo "npm publish is paused for the Trellis -> mini-trellis rename."
          echo "Packages: mini-trellis@0.1.0 and mini-trellis-core@0.1.0"
          exit 0
